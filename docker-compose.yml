version: '3.8'

networks:
  hospital-network:
    driver: bridge

services:
  # ----------------------------------------
  # 1. BASE DE DATOS CENTRAL
  # ----------------------------------------
  hospital-db:
    image: mysql:8.0
    container_name: hospital-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    networks:
      - hospital-network

  # ----------------------------------------
  # 2. EL DIRECTORIO (EUREKA)
  # ----------------------------------------
  ms-eureka-server:
    build: ./ms-eureka-server
    container_name: ms-eureka-server
    ports:
      - "8761:8761"
    networks:
      - hospital-network

  # ----------------------------------------
  # 3. EL ENRUTADOR (API GATEWAY)
  # ----------------------------------------
  ms-api-gateway:
    build: ./ms-api-gateway
    container_name: ms-api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://ms-eureka-server:8761/eureka/
    depends_on:
      - ms-eureka-server
    networks:
      - hospital-network

  # ----------------------------------------
  # 4. MICROSERVICIOS DE NEGOCIO
  # ----------------------------------------
  ms-citas-medicas:
    build: ./ms-citas-medicas
    container_name: ms-citas-medicas
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=hospital-db
      - EUREKA_URL=http://ms-eureka-server:8761/eureka/
    depends_on:
      - hospital-db
      - ms-eureka-server
    networks:
      - hospital-network

  ms-especialidades:
    build: ./ms-especialidades
    container_name: ms-especialidades
    ports:
      - "8084:8084"
    environment:
      - DB_HOST=hospital-db
      - EUREKA_URL=http://ms-eureka-server:8761/eureka/
    depends_on:
      - hospital-db
      - ms-eureka-server
    networks:
      - hospital-network

  ms-examenes:
    build: ./ms-examenes
    container_name: ms-examenes
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=hospital-db
      - EUREKA_URL=http://ms-eureka-server:8761/eureka/
    depends_on:
      - hospital-db
      - ms-eureka-server
    networks:
      - hospital-network

  ms-fichas-clinicas:
